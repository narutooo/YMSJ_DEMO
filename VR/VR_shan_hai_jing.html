<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VR 全景体验</title>
    <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            overflow: hidden;
            font-family: 'Noto Sans SC', sans-serif;
            background-color: #000;
        }

        #overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: url('./Material/Cover/cover.png') no-repeat center center;
            background-size: cover;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            /* 内容靠下排列 */
            align-items: center;
            z-index: 9999;
            color: white;
            transition: opacity 1s ease-in-out, visibility 1s;
            /* Removed padding-bottom: 20vh; as per instruction */
        }

        #overlay.hidden {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }

        .titles-wrapper {
            display: flex;
            flex-direction: row;
            justify-content: center;
            align-items: flex-end;
            gap: 120px;
            /* 增加间距 */
            margin-bottom: 12vh;
            /* 使用 margin 提升高度，不影响背景 */
            animation: fadeInUp 1.2s ease-out;
            width: 95%;
            max-width: 1600px;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .title-img {
            flex: 1;
            max-width: 380px;
            /* 适应横向三列 */
            width: 30%;
            height: auto;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            cursor: pointer;
            filter: drop-shadow(0 5px 15px rgba(0, 0, 0, 0.5));
        }

        .title-img:hover {
            transform: scale(1.1) translateY(-10px);
            filter: drop-shadow(0 20px 40px rgba(0, 0, 0, 0.8));
        }

        /* 隐藏 A-Frame 默认的 VR 按钮 (需求2: 去掉全屏/VR按钮) */
        .a-enter-vr-button {
            display: none !important;
        }

        #story-layer {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0);
            /* 去掉黑色半透明蒙版 */
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 10000;
            /* 比 overlay 更高 */
            transition: opacity 0.5s;
            opacity: 1;
            visibility: visible;
        }

        #story-layer.hidden {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }

        .story-content {
            max-width: 80%;
            max-height: 80%;
            /* Removed border-radius and box-shadow specific styles as requested */
            animation: popIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        @keyframes popIn {
            from {
                transform: scale(0.5);
                opacity: 0;
            }

            to {
                transform: scale(1);
                opacity: 1;
            }
        }

        /* 需求1: 确保音频按钮在最上层可见 */
        .audio-btn {
            position: fixed;
            top: 20px;
            right: 20px;
            width: 50px;
            height: 50px;
            z-index: 99999 !important;
            /* 强制最高层级 */
            cursor: pointer;
            transition: transform 0.2s;
            filter: drop-shadow(0 2px 5px rgba(0, 0, 0, 0.5));
            display: block;
            /* 确保不被隐藏 */
        }

        .audio-btn:hover {
            transform: scale(1.1);
        }

        .audio-btn img {
            width: 100%;
            height: 100%;
            display: block;
            pointer-events: none;
            /* 让点击穿透到父级 div */
        }

        .hud-icon {
            position: fixed;
            bottom: 30px;
            left: 30px;
            width: 300px;
            /* 放大尺寸以匹配红框范围 */
            height: auto;
            z-index: 10001;
            /* 保证在最上层 */
            cursor: pointer;
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            filter: drop-shadow(0 4px 8px rgba(0, 0, 0, 0.5));
            display: none;
            /* 默认隐藏 (首页不显示) */
        }

        #hero-entry {
            left: 30px;
        }

        #beast-entry {
            /* 在 Scene 3 中也是左下角 */
            position: fixed;
            bottom: 30px;
            left: 30px;
            width: 300px;
            /* 放大尺寸以匹配红框范围 */
            height: auto;
            z-index: 10001;
            cursor: pointer;
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            filter: drop-shadow(0 4px 8px rgba(0, 0, 0, 0.5));
            display: none;
            /* 默认隐藏 */
        }

        #beast-entry:hover {
            transform: scale(1.15);
            /* 悬停放大 */
            filter: drop-shadow(0 0 15px rgba(255, 215, 0, 0.6));
        }
    </style>
</head>

<body>

    <!-- Loading / Start Overlay -->
    <div id="overlay">
        <div class="titles-wrapper">
            <img id="btn-enter-scene2" src="./Material/Cover/Title_2.png" alt="Title 2" class="title-img">
            <img src="./Material/Cover/Title_3.png" alt="Title 3" class="title-img">
            <img src="./Material/Cover/Title_4.png" alt="Title 4" class="title-img">
        </div>
    </div>

    <!-- Story Popup Overlay -->
    <div id="story-layer" class="hidden">
        <img src="./assets/VR/ren.png" alt="Character" class="story-content">
    </div>

    <!-- Audio Control Button -->
    <div id="audio-control" class="audio-btn">
        <img id="audio-icon" src="./Material/icon/open.png" alt="Audio Control">
    </div>

    <!-- Hero Icon Entry (Scene 3) -->
    <img id="hero-entry" src="./Material/icon/Hero_icon.png" class="hud-icon" alt="Hero Entry">

    <!-- Divine Beast Entry (Enter Scene 1, shown in Scene 3) -->
    <img id="beast-entry" src="./Material/icon/Divine_beast_icon.png" class="hud-icon" alt="Divine Beast Entry"
        style="display: none;">

    <audio id="bg-music" src="./Material/music/Enter_the_game.MP3" autoplay loop></audio>
    <audio id="bgm-ancient" src="./Material/music/Chinese_ancient_style_music.MP3" loop></audio>
    <audio id="bgm-history" src="./Material/music/Historical_music.MP3" loop></audio>
    <audio id="hover-sound" src="./Material/music/dong.MP3"></audio>
    <audio id="story-audio" src="./assets/VR/audio.mp3"></audio>
    <audio id="scene2-audio" src="./assets/VR/audio_2.mp3"></audio>

    <!-- VR Scene -->
    <!-- 
       embedded: 嵌入模式，去除了全屏强制
       loading-screen: 自定义加载背景色 
    -->
    <a-scene loading-screen="backgroundColor: #000; dotsColor: #00f0ff">
        <a-assets>
            <img id="sky-texture" src="./Material/Cover.png" crossorigin="anonymous">
            <img id="sky-scene1" src="./Material/Scene/Scene_1.jpg" crossorigin="anonymous">
            <img id="sky-scene2" src="./Material/Scene/Scene_2.jpg" crossorigin="anonymous">
            <img id="sky-scene3" src="./Material/Scene/Scene_3.jpg" crossorigin="anonymous">
            <img id="beast-texture" src="./Material/icon/Divine_beast_icon.png" crossorigin="anonymous">
            <img id="renwu-texture" src="./assets/VR/RenWu.png" crossorigin="anonymous">
            <img id="dot-texture" src="./assets/VR/dot.png" crossorigin="anonymous">
            <img id="gczw-texture" src="./assets/VR/Gczw_icon.png" crossorigin="anonymous">
        </a-assets>

        <!-- 360 Sky Sphere -->
        <!-- 
           src: 引用资源
           rotation: 初始旋转角度，可根据图片内容调整
        -->
        <a-sky src="#sky-texture" rotation="0 -90 0"></a-sky>

        <!-- 交互人物 (任务 Banner) -->
        <!-- 
           原始尺寸 547x73 (约 7.5:1)
           位置调整到标记 2 (上方居中)
        -->
        <a-image id="renwu-entity" src="#renwu-texture" position="0 3.5 -6" width="4.5" height="0.6" class="clickable">
        </a-image>

        <!-- 跳转热点 (Dot) -->
        <!-- 
           位于 RenWu 下方 (Y=3.5 -> Y=2.5) 
        -->
        <a-image id="dot-entity" src="#dot-texture" position="0 2.5 -6" width="0.5" height="0.5" class="clickable">
            <!-- width/height 待定，假设是正方形图标 -->
            <!-- 可以加个简单的悬浮动画 -->
            <a-animation attribute="scale" dur="1000" from="1 1 1" to="1.2 1.2 1.2" direction="alternate"
                repeat="indefinite">
            </a-animation>
        </a-image>

        <!-- 场景2中的音频图标 -->
        <!-- 初始隐藏，切换场景后显示 -->
        <!-- 原始尺寸 828x74 (约 11.2:1) -->
        <!-- 放大尺寸以匹配视觉效果 -->
        <a-image id="gczw-entity" src="#gczw-texture" position="0 5 -8" width="9" height="0.8" class="clickable"
            visible="false">
        </a-image>




        <!-- Camera rig -->
        <a-entity position="0 0 0" rotation="0 0 0">
            <a-camera look-controls="enabled: true; reverseMouseDrag: false" wasd-controls="enabled: false">
                <!-- Cursor: 视觉中心点，必须配置 raycaster 才能响应点击 -->
                <!-- 
                     fuse: false (PC上点击不使用注视等待)
                     raycaster: 仅检测 .clickable 类，优化性能
                -->
                <a-entity cursor="fuse: false; rayOrigin: mouse" raycaster="objects: .clickable" position="0 0 -1"
                    geometry="primitive: ring; radiusInner: 0.02; radiusOuter: 0.03"
                    material="color: white; shader: flat; opacity: 0.5" visible="false">
                </a-entity>
            </a-camera>
        </a-entity>
    </a-scene>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const overlay = document.getElementById('overlay');
            const titleImgs = document.querySelectorAll('.title-img');
            const hoverSound = document.getElementById('hover-sound');

            // 为每个入口添加交互逻辑
            titleImgs.forEach(img => {
                // 悬停播放音效
                img.addEventListener('mouseenter', () => {
                    if (isAudioEnabled) {
                        hoverSound.currentTime = 0; // 重置进度，支持快速连续触发
                        hoverSound.play().catch(e => console.log('Hover sound blocked', e));
                    }
                });

                // 点击进入
                img.addEventListener('click', () => {
                    overlay.classList.add('hidden');
                    bgMusic.pause(); // 进入VR时停止背景音乐
                });
            });

            // 人物点击交互
            const renwu = document.querySelector('#renwu-entity');
            const storyLayer = document.getElementById('story-layer');
            const storyAudio = document.getElementById('story-audio');

            // 音频控制逻辑
            const audioBtn = document.getElementById('audio-control');
            const audioIcon = document.getElementById('audio-icon');
            let isAudioEnabled = true;

            const scene2Audio = document.getElementById('scene2-audio');
            const bgMusic = document.getElementById('bg-music');
            const bgmAncient = document.getElementById('bgm-ancient');
            const bgmHistory = document.getElementById('bgm-history');

            // 追踪当前活跃的背景音乐 (默认为首页音乐)
            let currentBgAudio = bgMusic;

            // 尝试强力自动播放逻辑
            const startPlayback = () => {
                // 只有在音频开启且 currentBgAudio 处于暂停状态时才播放
                if (isAudioEnabled && currentBgAudio.paused) {
                    currentBgAudio.play().then(() => {
                        // 播放成功，移除所有监听器
                        ['click', 'mousemove', 'touchstart', 'keydown'].forEach(evt =>
                            document.removeEventListener(evt, interactionHandler)
                        );
                    }).catch(e => {
                        console.log("Autoplay waiting for interaction...");
                    });
                }
            };

            const interactionHandler = () => {
                startPlayback();
            };

            // 1. 页面加载立即尝试
            if (isAudioEnabled) {
                currentBgAudio.play().catch(() => {
                    // 2. 如果失败，监听所有可能的交互事件
                    ['click', 'mousemove', 'touchstart', 'keydown'].forEach(evt =>
                        document.addEventListener(evt, interactionHandler)
                    );
                });
            }


            // ---------------------------
            // 场景入口交互逻辑
            // ---------------------------

            // 1. Title 2 特定逻辑 (进入 Scene 2)
            const btnScene2 = document.getElementById('btn-enter-scene2');
            btnScene2.addEventListener('click', (e) => {
                // 阻止通用的 click 处理 (如果需要的话，或者让通用逻辑先跑，这里覆盖)
                // 这里我们手动处理所有逻辑，确保顺序
                e.stopPropagation();

                overlay.classList.add('hidden');

                // 切换背景音乐
                bgMusic.pause();
                bgMusic.currentTime = 0;
                currentBgAudio = bgmAncient; // 更新当前活跃音乐

                if (isAudioEnabled) {
                    bgmAncient.play().catch(e => console.log(e));
                }

                // 切换 VR 场景背景
                const sky = document.querySelector('a-sky');
                sky.setAttribute('src', '#sky-scene2');

                // 可以在这里处理其他场景特定的物体显隐
                // 例如隐藏默认人物，显示 Scene 2 的特有物体
                document.querySelector('#renwu-entity').setAttribute('visible', false);
                document.querySelector('#dot-entity').setAttribute('visible', false);

                // 显示左下角的 Hero Icon (HTML固定位置)
                document.getElementById('hero-entry').style.display = 'block';

                // 确保 Scene 3 的 Beast Entry 隐藏 (HTML)
                document.getElementById('beast-entry').style.display = 'none';
            });

            // 2. Hero Icon 特定逻辑 (进入 Scene 3)
            const heroEntry = document.getElementById('hero-entry');

            // 悬停音效
            heroEntry.addEventListener('mouseenter', () => {
                if (isAudioEnabled) {
                    hoverSound.currentTime = 0;
                    hoverSound.play().catch(e => console.log('Hover sound blocked', e));
                }
            });

            // 点击切换逻辑
            heroEntry.addEventListener('click', (e) => {
                e.stopPropagation();

                overlay.classList.add('hidden'); // 确保隐藏首页

                // 切换音乐
                if (currentBgAudio) {
                    currentBgAudio.pause();
                    currentBgAudio.currentTime = 0;
                }

                currentBgAudio = bgmHistory; // 切换到历史音乐

                if (isAudioEnabled) {
                    bgmHistory.play().catch(e => console.log(e));
                }

                // 切换全景图
                const sky = document.querySelector('a-sky');
                sky.setAttribute('src', '#sky-scene3');

                // 隐藏其他场景的物体
                document.querySelector('#renwu-entity').setAttribute('visible', false);
                document.querySelector('#dot-entity').setAttribute('visible', false);
                document.querySelector('#gczw-entity').setAttribute('visible', false);


                // 进入第三场景后，隐藏 Hero Icon
                heroEntry.style.display = 'none';

                // 显示 Beast Icon (HTML固定在左下角, Scene 3专属)
                document.getElementById('beast-entry').style.display = 'block';
            });

            // 3. Beast Icon 交互逻辑 (左下角HTML元素)
            const beastEntry = document.getElementById('beast-entry');

            // 悬停音效
            beastEntry.addEventListener('mouseenter', () => {
                if (isAudioEnabled) {
                    hoverSound.currentTime = 0;
                    hoverSound.play().catch(e => console.log('Hover sound blocked', e));
                }
            });

            // 点击切换逻辑 -> 进入 Scene 1
            beastEntry.addEventListener('click', (e) => {
                e.stopPropagation();

                // 隐藏自己
                beastEntry.style.display = 'none';

                // 切换音乐 (切换回首页音乐 Loop)
                if (currentBgAudio) {
                    currentBgAudio.pause();
                    currentBgAudio.currentTime = 0;
                }
                currentBgAudio = bgMusic;
                if (isAudioEnabled) {
                    bgMusic.play().catch(e => console.log(e));
                }

                // 切换全景图 -> Scene 1
                const sky = document.querySelector('a-sky');
                sky.setAttribute('src', '#sky-scene1');
            });


            // 通用入口逻辑 (处理 hover 和其他两个入口的默认行为)
            titleImgs.forEach(img => {
                // 悬停播放音效
                img.addEventListener('mouseenter', () => {
                    if (isAudioEnabled) {
                        hoverSound.currentTime = 0;
                        hoverSound.play().catch(e => console.log('Hover sound blocked', e));
                    }
                });

                // 点击进入 (仅针对非 Title 2 的其他入口，或者是通用行为)
                // 注意：由于 Title 2 上面加了 stopPropagation，这里不会被 Title 2 触发
                img.addEventListener('click', () => {
                    overlay.classList.add('hidden');
                    bgMusic.pause(); // 默认行为：停止首页背景音乐
                    // 如果是其他入口，可能没有后续背景音乐，或者保持静音
                    // 这里暂不处理 currentBgAudio = null 或其他，视需求而定
                });
            });

            // ---------------------------
            // 全局音频按钮控制 (重构)
            // ---------------------------
            audioBtn.addEventListener('click', (e) => {
                e.stopPropagation();
                isAudioEnabled = !isAudioEnabled;

                if (isAudioEnabled) {
                    // 开启
                    audioIcon.src = "./Material/icon/open.png";

                    // 优先播放故事音频（如果蒙版显示）
                    if (!storyLayer.classList.contains('hidden')) {
                        storyAudio.play().catch(e => console.log(e));
                        // 背景音乐是否需要同时播放？通常不需要，先保持暂停
                    } else {
                        // 否则播放当前的背景音乐
                        if (currentBgAudio && currentBgAudio.paused) {
                            currentBgAudio.play().catch(e => console.log(e));
                        }
                    }
                } else {
                    // 关闭
                    audioIcon.src = "./Material/icon/close.png";
                    // 停止所有可能的音频
                    bgMusic.pause();
                    bgmAncient.pause();
                    bgmHistory.pause();
                    storyAudio.pause();
                    scene2Audio.pause();
                }
            });

            // 点击故事层关闭
            storyLayer.addEventListener('click', () => {
                storyLayer.classList.add('hidden');
                storyAudio.pause();
                storyAudio.currentTime = 0;
            });

            renwu.addEventListener('click', () => {
                const camera = document.querySelector('a-camera');

                // 1. 播放放大动画 (强制放大)
                let currentFov = parseFloat(camera.getAttribute('fov') || 80);

                camera.setAttribute('animation', {
                    property: 'fov',
                    from: currentFov, // 保证平滑
                    to: 40,   // 目标 FOV
                    dur: 1500,
                    easing: 'easeInOutQuad'
                });

                // 2. 显示蒙版和图片
                storyLayer.classList.remove('hidden');

                // 3. 播放音频 (如果允许)
                if (isAudioEnabled) {
                    storyAudio.currentTime = 0; // 重置进度
                    storyAudio.play().catch(e => console.error("Audio play failed:", e));
                }
            });

            // 场景跳转交互 (点击 dot)
            const dot = document.querySelector('#dot-entity');
            const sky = document.querySelector('a-sky');
            const gczw = document.querySelector('#gczw-entity');

            dot.addEventListener('click', () => {
                const camera = document.querySelector('a-camera');

                // 需求：点击后有一个镜头前推的效果 (Zoom In)，然后再跳转

                // 1. 获取当前 FOV
                let currentFov = parseFloat(camera.getAttribute('fov') || 80);

                // 2. 播放前推动画 (FOV 变小)
                camera.setAttribute('animation', {
                    property: 'fov',
                    from: currentFov,
                    to: 30,    // 放大效果
                    dur: 800,  // 持续 800ms
                    easing: 'easeInQuad'
                });

                // 3. 动画结束后切换场景
                setTimeout(() => {
                    // 切换全景图
                    sky.setAttribute('src', './assets/VR/quanJing_2.jpg');

                    // 停止动画，防止干扰
                    camera.removeAttribute('animation');

                    // 切换后直接设置为最广角 (FOV 100)，画面静止
                    camera.setAttribute('fov', 100);

                    // 隐藏上一个场景的交互物
                    renwu.setAttribute('visible', false);
                    dot.setAttribute('visible', false);

                    // 显示新场景的交互物
                    gczw.setAttribute('visible', true);

                    // 停止音频
                    storyAudio.pause();
                }, 800);
            });

            // 场景2：音频图标点击交互
            gczw.addEventListener('click', () => {
                if (isAudioEnabled) {
                    // 播放场景2的音频
                    // 如果正在播放，就重置进度重新播放，或者可以做暂停逻辑
                    if (scene2Audio.paused) {
                        scene2Audio.currentTime = 0;
                        scene2Audio.play().catch(e => console.error(e));
                    } else {
                        // 如果已经在播放，点击也许可以暂停？或者重新开始。这里暂定重新开始。
                        scene2Audio.currentTime = 0;
                        scene2Audio.play().catch(e => console.error(e));
                    }
                }
            });

            // 鼠标滚轮缩放功能
            const camera = document.querySelector('a-camera');
            window.addEventListener('wheel', (event) => {
                // 如果正在播放动画，可能需要停止它，或者让用户手动接管
                camera.removeAttribute('animation');

                // 获取当前 FOV
                let currentFov = camera.getAttribute('fov');
                let fov = currentFov ? parseFloat(currentFov) : 80;

                if (isNaN(fov)) fov = 80;

                // 根据滚轮方向调整 FOV
                const zoomSpeed = 0.05;
                fov += event.deltaY * zoomSpeed;

                // 限制 FOV 范围
                fov = Math.max(30, Math.min(100, fov));

                camera.setAttribute('fov', fov);
            });
        });
    </script>
</body>

</html>
