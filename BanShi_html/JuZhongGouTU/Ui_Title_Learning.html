<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1920, height=1080, initial-scale=1.0">
    <title>H5 Interactive Canvas</title>
    <style>
        /* =========================================
           Reset & Base Setup
           ========================================= */
        * {
            box-sizing: border-box;
            user-select: none;
            /* Prevent native text selection for dragging */
        }

        body,
        html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #333;
            font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
        }

        /* The Main Stage 1920x1080 */
        #app {
            position: relative;
            width: 1920px;
            height: 1080px;
            background: linear-gradient(to bottom, #4facfe 0%, #00f2fe 100%);
            /* Sky fallback */
            overflow: hidden;
            transform-origin: top left;
            box-shadow: 0 0 50px rgba(0, 0, 0, 0.5);
            margin: 0 auto;
        }

        /* Cloud Simulation (CSS Decor) */
        .cloud-bg {
            position: absolute;
            background: rgba(255, 255, 255, 0.4);
            border-radius: 50%;
            filter: blur(40px);
            pointer-events: none;
            z-index: 10;
        }

        /* =========================================
           Component Styles
           ========================================= */
        .comp {
            position: absolute;
            transform-origin: top left;
            cursor: move;
        }

        /* Content Editable visual tweak */
        [contenteditable="true"] {
            cursor: text;
        }

        [contenteditable="true"]:focus {
            outline: none;
            cursor: text;
        }

        /* Selection State */
        .comp.selected {
            outline: 2px dashed #0099ff;
            z-index: 9999 !important;
            /* Temporarily bring to front when editing */
        }

        /* Delete Button (Red X) */
        .delete-btn {
            position: absolute;
            top: -15px;
            right: -15px;
            width: 30px;
            height: 30px;
            background-color: #ff4d4f;
            color: white;
            border-radius: 50%;
            text-align: center;
            line-height: 28px;
            font-weight: bold;
            font-size: 18px;
            cursor: pointer;
            display: none;
            z-index: 10000;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.2);
        }

        .comp.selected .delete-btn {
            display: block;
        }

        /* Resize Handle (White Circle) */
        .resize-handle {
            position: absolute;
            bottom: -12px;
            right: -12px;
            width: 24px;
            height: 24px;
            background-color: white;
            border: 2px solid #ccc;
            border-radius: 50%;
            cursor: nwse-resize;
            display: none;
            z-index: 10000;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.2);
        }

        .comp.selected .resize-handle {
            display: block;
        }

        /* =========================================
           Specific Visual Styles (Replicating the Image)
           ========================================= */

        /* 1. Main Board (Container) */
        .board-container {
            width: 1100px;
            height: 650px;
            background-color: #fff;
            border-radius: 30px;
            /* Double border effect using box-shadow */
            border: 8px solid #F48221;
            box-shadow:
                inset 0 0 0 4px #fff,
                /* White gap */
                inset 0 0 0 6px #F48221,
                /* Inner orange line */
                0 20px 40px rgba(0, 0, 0, 0.15);
            /* Drop shadow */
            padding: 80px 60px 60px 60px;
            z-index: 200;
        }

        /* 2. Top Left Tag */
        .tag-red {
            width: 60px;
            height: 200px;
            background: #ff4d4f;
            color: white;
            border-radius: 0 0 30px 30px;
            font-size: 28px;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            writing-mode: vertical-rl;
            letter-spacing: 8px;
            box-shadow: 4px 4px 10px rgba(0, 0, 0, 0.2);
            z-index: 500;
        }

        .tag-red::before {
            content: '';
            position: absolute;
            top: 10px;
            width: 80%;
            height: 90%;
            border: 2px dashed rgba(255, 255, 255, 0.5);
            border-radius: 0 0 20px 20px;
            pointer-events: none;
        }

        /* 3. Title (Cartoon Text) */
        .title-text {
            width: 400px;
            height: 120px;
            font-size: 90px;
            font-weight: 900;
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 600;
            /* Simulating the cartoon stroke and gradient */
            -webkit-text-stroke: 4px #fff;
            text-shadow:
                0px 4px 0px #F48221,
                4px 8px 10px rgba(0, 0, 0, 0.2);
            background: linear-gradient(180deg, #ffcf4b 0%, #ff8e25 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            /* Fallback for background clip interaction */
            pointer-events: auto;
        }

        /* Helper for the stroke to show behind gradient text */
        .title-text::after {
            content: attr(data-text);
            position: absolute;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            -webkit-text-fill-color: white;
            /* The stroke color */
            z-index: -1;
            text-align: center;
            -webkit-text-stroke: 12px #fff;
        }

        .title-text::before {
            content: attr(data-text);
            position: absolute;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            -webkit-text-fill-color: #F48221;
            z-index: -2;
            text-align: center;
            -webkit-text-stroke: 18px #F48221;
            transform: translateY(4px);
        }

        /* 4. Content List Items */
        .list-item {
            width: 950px;
            height: auto;
            min-height: 80px;
            display: flex;
            align-items: flex-start;
            margin-bottom: 30px;
            z-index: 550;
        }

        .num-badge {
            flex-shrink: 0;
            width: 44px;
            height: 44px;
            background-color: #ed1c24;
            color: white;
            border-radius: 50%;
            font-size: 28px;
            font-weight: bold;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-right: 20px;
            margin-top: 5px;
            font-family: Arial, sans-serif;
        }

        .text-content {
            flex-grow: 1;
            font-size: 32px;
            color: #333;
            line-height: 1.6;
            font-weight: 500;
        }

        /* 5. Logo */
        .logo-text {
            width: 200px;
            height: 50px;
            color: white;
            font-size: 32px;
            font-weight: bold;
            text-align: right;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.2);
            z-index: 500;
            opacity: 0.9;
        }
    </style>
</head>

<body>

    <div id="app">
        <div class="cloud-bg" style="width: 600px; height: 300px; top: 600px; left: -100px;"></div>
        <div class="cloud-bg" style="width: 500px; height: 250px; top: 100px; left: 100px;"></div>
        <div class="cloud-bg" style="width: 700px; height: 400px; bottom: -100px; right: -100px;"></div>
        <div class="cloud-bg" style="width: 300px; height: 150px; top: 300px; right: 200px;"></div>

        <div class="comp tag-red" style="top: 0; left: 80px;" data-scale="1">
            <div contenteditable="true">开卷有益</div>
            <div class="delete-btn">×</div>
            <div class="resize-handle"></div>
        </div>

        <div class="comp logo-text" style="top: 50px; right: 60px;" data-scale="1">
            <div contenteditable="true">学而思网校</div>
            <div class="delete-btn">×</div>
            <div class="resize-handle"></div>
        </div>

        <div class="comp board-container" style="top: 215px; left: 410px;" data-scale="1">
            <div style="display: flex; margin-bottom: 40px;">
                <div class="num-badge" contenteditable="true">1</div>
                <div class="text-content" contenteditable="true">了解格列佛在飞岛国的所见所闻</div>
            </div>

            <div style="display: flex; margin-bottom: 40px;">
                <div class="num-badge" contenteditable="true">2</div>
                <div class="text-content" contenteditable="true">学习并巩固“句子含义理解题”的阅读技法，配合习题，巩固训练</div>
            </div>

            <div style="display: flex; margin-bottom: 0px;">
                <div class="num-badge" contenteditable="true">3</div>
                <div class="text-content" contenteditable="true">探索天空之城飞岛国完美表象下的秘密，了解“脚踏实地”的道理</div>
            </div>

            <div class="delete-btn">×</div>
            <div class="resize-handle"></div>
        </div>

        <div class="comp title-text" data-text="学习目标" style="top: 150px; left: 760px;" data-scale="1">
            <div contenteditable="true">学习目标</div>
            <div class="delete-btn">×</div>
            <div class="resize-handle"></div>
        </div>

    </div>

    <script>
        /**
         * Generic Interactive HTML Generator Logic
         * Features: Drag, Scale, Delete, Undo/Redo, Text Edit
         */

        const app = document.getElementById('app');
        let historyStack = [];
        let historyIndex = -1;
        let isDragging = false;
        let isResizing = false;
        let currentElement = null;
        let startX, startY, startLeft, startTop, startScale;

        // --- History System ---
        function saveState() {
            // Limit stack size
            if (historyStack.length > 20) historyStack.shift();
            // Remove redo future if we make a new change
            if (historyIndex < historyStack.length - 1) {
                historyStack = historyStack.slice(0, historyIndex + 1);
            }
            historyStack.push(app.innerHTML);
            historyIndex++;
        }

        // Initial State
        saveState();

        function undo() {
            if (historyIndex > 0) {
                historyIndex--;
                restoreState(historyStack[historyIndex]);
            }
        }

        function redo() {
            if (historyIndex < historyStack.length - 1) {
                historyIndex++;
                restoreState(historyStack[historyIndex]);
            }
        }

        function restoreState(html) {
            app.innerHTML = html;
            // Re-attach listeners is handled via delegation on 'document', 
            // so we don't need to re-bind per element. 
            // Deselect everything visually
            document.querySelectorAll('.selected').forEach(el => el.classList.remove('selected'));
        }

        // --- Interaction Logic ---

        // Helper: Find closest interactive component
        function getComp(target) {
            return target.closest('.comp');
        }

        // 1. Selection & Text Edit Handling
        document.addEventListener('mousedown', (e) => {
            const comp = getComp(e.target);

            // Clicked on background -> Deselect all
            if (!comp && e.target.id === 'app') {
                document.querySelectorAll('.selected').forEach(el => el.classList.remove('selected'));
                return;
            }

            // Clicked on Delete Button
            if (e.target.classList.contains('delete-btn')) {
                const parent = e.target.closest('.comp');
                if (parent) {
                    parent.remove();
                    saveState();
                }
                return;
            }

            // Clicked on Component
            if (comp) {
                // If dragging resize handle, don't change selection logic, just start resize
                if (e.target.classList.contains('resize-handle')) {
                    startResize(e, comp);
                    return;
                }

                // Select this one, deselect others
                if (!comp.classList.contains('selected')) {
                    document.querySelectorAll('.selected').forEach(el => el.classList.remove('selected'));
                    comp.classList.add('selected');
                }

                // If clicking editable text, allow default behavior (focus), don't drag immediately
                if (e.target.isContentEditable) {
                    // We still might want to drag if they drag the container border, 
                    // but let's let text selection happen if they click text.
                    // However, we track mousedown for potential drag if they move mouse.
                }

                startDrag(e, comp);
            }
        });

        // 2. Dragging Logic
        function startDrag(e, comp) {
            // Prevent drag if clicking resize handle or if focusing text
            if (e.target.classList.contains('resize-handle')) return;

            isDragging = true;
            currentElement = comp;
            startX = e.clientX;
            startY = e.clientY;
            startLeft = parseInt(comp.style.left || 0);
            startTop = parseInt(comp.style.top || 0);
        }

        // 3. Resizing Logic
        function startResize(e, comp) {
            isResizing = true;
            currentElement = comp;
            startX = e.clientX;
            // Parse current scale
            startScale = parseFloat(comp.getAttribute('data-scale')) || 1;
            e.stopPropagation(); // Stop drag from firing
        }

        // Global Move
        document.addEventListener('mousemove', (e) => {
            if (isDragging && currentElement) {
                // Determine if valid drag (ignore small jitters if text editing)
                const dx = e.clientX - startX;
                const dy = e.clientY - startY;

                // Only move position
                currentElement.style.left = `${startLeft + dx}px`;
                currentElement.style.top = `${startTop + dy}px`;
            }

            if (isResizing && currentElement) {
                const dx = e.clientX - startX;
                // Simple logic: dragging right/down increases scale
                // Sensitivity: 100px movement = 0.1 scale change
                const scaleDelta = dx * 0.002;
                const newScale = Math.max(0.2, startScale + scaleDelta); // Min scale 0.2

                currentElement.style.transform = `scale(${newScale})`;
                currentElement.setAttribute('data-scale', newScale);
            }
        });

        // Global Up
        document.addEventListener('mouseup', () => {
            if (isDragging || isResizing) {
                saveState(); // Save snapshot after operation
            }
            isDragging = false;
            isResizing = false;
            currentElement = null;
        });

        // Text Edit Snapshot (Blur)
        document.addEventListener('focusout', (e) => {
            if (e.target.isContentEditable) {
                saveState();
            }
        });

        // Title Data Update (Special case for CSS attribute sync)
        document.addEventListener('input', (e) => {
            // If editing the title text, we need to sync the data-text attribute for the stroke effect
            if (e.target.parentElement.classList.contains('title-text')) {
                e.target.parentElement.setAttribute('data-text', e.target.innerText);
            }
        });

        // 4. Keyboard Shortcuts (Delete, Undo)
        document.addEventListener('keydown', (e) => {
            // Delete / Backspace
            if (e.key === 'Delete' || e.key === 'Backspace') {
                // Only delete if not editing text
                const activeTag = document.activeElement.tagName;
                if (activeTag !== 'DIV' && activeTag !== 'P' && !document.activeElement.isContentEditable) {
                    const selected = document.querySelector('.comp.selected');
                    if (selected) {
                        selected.remove();
                        saveState();
                    }
                } else {
                    // Even if isContentEditable, if the container is selected but text is NOT explicitly focused (rare), delete container?
                    // Use safe approach: Only delete container if NO text is being edited.
                }
            }

            // Undo (Ctrl+Z) / Redo (Ctrl+Y or Ctrl+Shift+Z)
            if ((e.ctrlKey || e.metaKey) && e.key === 'z') {
                e.preventDefault();
                if (e.shiftKey) {
                    redo();
                } else {
                    undo();
                }
            }
            if ((e.ctrlKey || e.metaKey) && e.key === 'y') {
                e.preventDefault();
                redo();
            }
        });

        // Initial Scaling for Fit Screen (Optional viewing helper)
        function fitScreen() {
            const scaleX = window.innerWidth / 1920;
            const scaleY = window.innerHeight / 1080;
            const scale = Math.min(scaleX, scaleY, 1);
            if (scale < 1) {
                document.body.style.transform = `scale(${scale})`;
                document.body.style.transformOrigin = 'top left';
                document.body.style.width = `${1920}px`;
                document.body.style.height = `${1080}px`;
            }
        }
        // window.addEventListener('resize', fitScreen);
        // fitScreen();
    </script>

</body>

</html>
