<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Courseware Interactive Layout</title>
    <style>
        /* =========================================
           1. 全局重置与画布设置
           ========================================= */
        * {
            box-sizing: border-box;
            user-select: none;
            /* 防止拖拽时选中文本，编辑模式例外 */
        }

        body,
        html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #333;
            /* 画布外的深色背景 */
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
        }

        /* 1920x1080 固定画布 */
        #app {
            position: relative;
            width: 1920px;
            height: 1080px;
            background: linear-gradient(to bottom, #FF6B6B 0%, #FFD93D 40%, #FF9F1C 70%, #6D4C41 100%);
            /* 模拟晚霞背景 */
            overflow: hidden;
            box-shadow: 0 0 50px rgba(0, 0, 0, 0.5);
        }

        /* =========================================
           2. 组件通用样式 (交互核心)
           ========================================= */
        .comp {
            position: absolute;
            transform-origin: top left;
            /* 缩放基准点 */
            cursor: move;
        }

        /* 选中状态 */
        .comp.selected {
            outline: 2px dashed #0099ff;
            z-index: 1000 !important;
            /* 临时置顶 */
        }

        /* 删除按钮 (选中时显示) */
        .delete-btn {
            position: absolute;
            top: -15px;
            right: -15px;
            width: 30px;
            height: 30px;
            background: red;
            color: white;
            border-radius: 50%;
            text-align: center;
            line-height: 28px;
            font-weight: bold;
            font-family: Arial, sans-serif;
            cursor: pointer;
            display: none;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.3);
            pointer-events: auto;
            /* 确保能点到 */
        }

        .comp.selected .delete-btn {
            display: block;
        }

        /* 缩放手柄 (选中时显示) */
        .resizer {
            position: absolute;
            bottom: -10px;
            right: -10px;
            width: 24px;
            height: 24px;
            background: white;
            border: 2px solid #0099ff;
            border-radius: 50%;
            cursor: se-resize;
            display: none;
            pointer-events: auto;
        }

        .comp.selected .resizer {
            display: block;
        }

        /* 文本编辑模式 */
        [contenteditable="true"] {
            cursor: text;
            user-select: text;
        }

        [contenteditable="true"]:focus {
            outline: none;
            background-color: rgba(255, 255, 255, 0.1);
            /* 编辑时微弱高亮 */
        }

        /* =========================================
           3. 视觉还原样式 (根据参考图)
           ========================================= */

        /* 白色主容器 */
        .card-container {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 40px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
            padding: 60px;
            display: flex;
            flex-direction: column;
        }

        /* 左上角标签 */
        .badge {
            font-size: 32px;
            font-weight: bold;
            color: #4A90E2;
            letter-spacing: 2px;
            background: transparent;
        }

        /* 正文内容 */
        .story-text {
            font-size: 38px;
            line-height: 1.8;
            color: #333;
            font-weight: 500;
            text-align: justify;
        }

        /* 填空下划线 */
        .underline {
            text-decoration: underline;
            text-underline-offset: 8px;
            font-weight: bold;
        }

        /* 红色/粉色 按钮 */
        .btn-red {
            background: linear-gradient(90deg, #FF758C 0%, #FF7EB3 100%);
            border-radius: 50px;
            color: white;
            font-size: 32px;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 5px 15px rgba(255, 117, 140, 0.4);
        }

        /* 蓝色 按钮 */
        .btn-blue {
            background: linear-gradient(90deg, #4facfe 0%, #00f2fe 100%);
            border-radius: 50px;
            color: white;
            font-size: 32px;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 5px 15px rgba(79, 172, 254, 0.4);
        }

        /* LOGO */
        .logo {
            color: white;
            font-size: 28px;
            font-weight: bold;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.3);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        /* 狮子占位符 (没有素材图，用CSS模拟) */
        .lion-character {
            background: transparent;
            /* 实际上这里应该放 img，如果没有图，就用 div 结构模拟 */
        }

        .lion-img-mock {
            width: 100%;
            height: 100%;
            background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><text y="80" font-size="80">🦁</text></svg>');
            background-repeat: no-repeat;
            background-size: contain;
            filter: drop-shadow(5px 5px 10px rgba(0, 0, 0, 0.3));
        }
    </style>
</head>

<body>

    <div id="app">

        <div class="comp" style="top: 700px; left: -50px; width: 400px; height: 400px; z-index: 50;">
            <div
                style="width:100%; height:100%; background: #5D4037; border-radius: 50%; opacity: 0.8; filter: blur(20px);">
            </div>
        </div>
        <div class="comp" style="top: 750px; left: 1600px; width: 500px; height: 400px; z-index: 50;">
            <div
                style="width:100%; height:100%; background: #3E2723; border-radius: 40%; opacity: 0.8; filter: blur(30px);">
            </div>
        </div>

        <div class="comp logo" style="top: 40px; right: 60px; width: 200px; height: 50px; z-index: 800;">
            <span contenteditable="true">🎓 学而思网校</span>
        </div>

        <div class="comp card-container" style="top: 80px; left: 140px; width: 1300px; height: 860px; z-index: 100;">

            <div class="badge" contenteditable="true" style="margin-bottom: 30px;">
                第四册 &nbsp;第12页
            </div>

            <div class="story-text" contenteditable="true">
                <p style="margin-top: 0;">
                    赫拉克勒斯身手敏捷，闪电般地一躲，巨狮扑了个空。这下可激怒了这头凶猛的怪兽，它扭转身子，浑身毛发竖立，甩着大尾巴再一次向赫拉克勒斯袭来。赫拉克勒斯机智地借助狮体移动产生的旋风，两脚一蹬，升到了半空，然后他举起木棍，<span
                        class="underline">__________________</span>。木棍被打断，巨狮也被打得昏了头脑，四脚一软，瘫在了地上。</p>
            </div>

            <div class="delete-btn">X</div>
            <div class="resizer"></div>
        </div>

        <div class="comp btn-red" style="top: 700px; left: 260px; width: 680px; height: 80px; z-index: 500;">
            <span contenteditable="true">这头凶猛的怪兽被激怒后做了什么？</span>
            <div class="delete-btn">X</div>
            <div class="resizer"></div>
        </div>

        <div class="comp btn-blue" style="top: 800px; left: 360px; width: 480px; height: 80px; z-index: 500;">
            <span contenteditable="true">赫拉克勒斯会如何应对呢？</span>
            <div class="delete-btn">X</div>
            <div class="resizer"></div>
        </div>

        <div class="comp lion-character" style="top: 620px; left: 1300px; width: 350px; height: 450px; z-index: 600;">
            <div class="lion-img-mock"></div>
            <div class="delete-btn">X</div>
            <div class="resizer"></div>
        </div>

    </div>

    <script>
        /* =========================================
           4. 交互逻辑 (Interaction Specs)
           ========================================= */

        const app = document.getElementById('app');
        let historyStack = [];
        const MAX_HISTORY = 20;

        // --- 历史记录系统 ---
        function saveState() {
            // 深拷贝当前的 innerHTML
            if (historyStack.length >= MAX_HISTORY) historyStack.shift();
            historyStack.push(app.innerHTML);
        }

        function undo() {
            if (historyStack.length > 0) {
                const previousState = historyStack.pop();
                // 在恢复前再存一次当前状态到 redo 栈 (这里简化为单向撤销，恢复上一帧)
                // 实际操作：直接替换 HTML
                app.innerHTML = previousState;
            }
        }

        // 初始化：保存第一帧
        saveState();

        // 监听键盘撤销 (Ctrl+Z) 和 删除 (Delete)
        document.addEventListener('keydown', (e) => {
            if ((e.ctrlKey || e.metaKey) && e.key === 'z') {
                e.preventDefault();
                undo();
            }
            if (e.key === 'Delete' || e.key === 'Backspace') {
                const selected = document.querySelector('.comp.selected');
                // 如果焦点不在文字编辑中，才删除组件
                const isEditing = document.activeElement.isContentEditable;
                if (selected && !isEditing) {
                    saveState(); // 动作前保存
                    selected.remove();
                }
            }
        });

        // --- 全局事件委托 (Event Delegation) ---

        let isDragging = false;
        let isResizing = false;
        let currentEl = null;
        let startX, startY;

        // 拖拽数据
        let initialLeft, initialTop;

        // 缩放数据
        let initialWidth, initialHeight, initialScale;

        // 1. Mouse Down
        app.addEventListener('mousedown', (e) => {
            // 如果点击的是删除按钮
            if (e.target.classList.contains('delete-btn')) {
                saveState();
                e.target.closest('.comp').remove();
                return;
            }

            // 检查是否点击了组件
            const comp = e.target.closest('.comp');

            // 点击空白处，取消选中
            if (!comp) {
                document.querySelectorAll('.comp.selected').forEach(el => el.classList.remove('selected'));
                return;
            }

            // 选中当前组件
            if (!comp.classList.contains('selected')) {
                document.querySelectorAll('.comp.selected').forEach(el => el.classList.remove('selected'));
                comp.classList.add('selected');
            }
            currentEl = comp;

            // 检查是否点击了缩放手柄
            if (e.target.classList.contains('resizer')) {
                isResizing = true;
                startX = e.clientX;
                startY = e.clientY;

                // 获取当前的 scale 值 (matrix解析)
                const style = window.getComputedStyle(currentEl);
                const matrix = new WebKitCSSMatrix(style.transform);
                initialScale = matrix.a; // scaleX

                // 记录原始尺寸用于计算比例，而不是直接改尺寸
                // 这里为了简化逻辑，我们假设元素初始是以 scale(1) 渲染的 width/height
                // 实际上缩放是改变 transform: scale
                return;
            }

            // 否则是拖拽 (除非点击的是可编辑文本且已经聚焦)
            if (!e.target.isContentEditable || e.target === comp) {
                isDragging = true;
                startX = e.clientX;
                startY = e.clientY;
                initialLeft = parseInt(currentEl.style.left || 0);
                initialTop = parseInt(currentEl.style.top || 0);
            }
        });

        // 2. Mouse Move
        window.addEventListener('mousemove', (e) => {
            if (!currentEl) return;

            if (isDragging) {
                const dx = e.clientX - startX;
                const dy = e.clientY - startY;
                currentEl.style.left = `${initialLeft + dx}px`;
                currentEl.style.top = `${initialTop + dy}px`;
            } else if (isResizing) {
                // 简单的缩放逻辑：根据鼠标X轴移动距离调整 Scale
                const dx = e.clientX - startX;
                // 灵敏度控制
                const scaleDelta = dx * 0.002;
                const newScale = Math.max(0.1, initialScale + scaleDelta);
                currentEl.style.transform = `scale(${newScale})`;
            }
        });

        // 3. Mouse Up
        window.addEventListener('mouseup', () => {
            if (isDragging || isResizing) {
                saveState(); // 操作结束，保存快照
            }
            isDragging = false;
            isResizing = false;
            currentEl = null;
        });

        // 监听文本编辑结束 (Blur) 保存状态
        app.addEventListener('focusout', (e) => {
            if (e.target.isContentEditable) {
                saveState();
            }
        });

    </script>
</body>

</html>
