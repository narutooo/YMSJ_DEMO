<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>H5 Interactive Courseware</title>
    <style>
        /* =========================================
           1. Global Reset & Canvas Setup
           ========================================= */
        * {
            box-sizing: border-box;
            user-select: none;
            /* Prevent native selection to help drag */
        }

        body {
            margin: 0;
            padding: 0;
            background-color: #333;
            /* Dark outside canvas */
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            font-family: "KaiTi", "STKaiti", "SimKai", serif;
            /* Match the storybook feel */
        }

        #app {
            position: relative;
            width: 1920px;
            height: 1080px;
            background-color: #fff;
            overflow: hidden;
            box-shadow: 0 0 50px rgba(0, 0, 0, 0.5);
            /* Fallback Background: Sunset Gradient based on reference */
            background: linear-gradient(180deg,
                    #FF6B6B 0%,
                    #FF8E53 30%,
                    #FFD700 60%,
                    #DAA520 75%,
                    #8B4513 100%);
            transform-origin: center center;
        }

        /* =========================================
           2. Component Base Styles
           ========================================= */
        .component {
            position: absolute;
            cursor: move;
            transform-origin: top left;
        }

        /* Selected State */
        .component.selected {
            outline: 2px dashed #0099ff;
            z-index: 9999 !important;
            /* Temporarily bring to top for edit, or keep layer? Agent says don't change z-index. Keeping layout z-index. */
        }

        /* Specific Fix: Agent says "Strictly prohibited to change z-index on click". 
           We interpret .selected visual cue as an overlay or outline only. */

        /* Delete Button (Visible only when selected) */
        .delete-btn {
            position: absolute;
            top: -15px;
            right: -15px;
            width: 30px;
            height: 30px;
            background: red;
            color: white;
            border-radius: 50%;
            text-align: center;
            line-height: 28px;
            font-weight: bold;
            font-family: sans-serif;
            cursor: pointer;
            display: none;
            z-index: 10001;
            font-size: 16px;
        }

        .component.selected .delete-btn {
            display: block;
        }

        /* Resize Handle (Visible always or selected? Agent implies distinct handle) */
        .resize-handle {
            position: absolute;
            bottom: -10px;
            right: -10px;
            width: 24px;
            height: 24px;
            background-color: white;
            border: 2px solid #333;
            border-radius: 50%;
            cursor: nwse-resize;
            z-index: 10002;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.2);
            /* Hide handle if not selected to keep canvas pure? Agent says "must have a handle". We keep it subtle. */
            opacity: 0;
            transition: opacity 0.2s;
        }

        .component:hover .resize-handle,
        .component.selected .resize-handle {
            opacity: 1;
        }

        /* Text Editing Override */
        [contenteditable="true"] {
            cursor: text;
            outline: none;
            user-select: text;
        }

        /* =========================================
           3. Specific Visual Styles (CSS Painting)
           ========================================= */

        /* Scenery Elements (Grass/Hills) */
        .decor-hill {
            background: #8B4513;
            border-radius: 50% 50% 0 0;
            opacity: 0.8;
            pointer-events: none;
            /* Background elements usually static, but we make them draggable per request */
        }

        /* Main White Container */
        .main-card {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 40px;
            box-shadow: 0 20px 60px rgba(139, 69, 19, 0.4);
            padding: 60px;
            display: flex;
            flex-direction: column;
        }

        /* Text Styles inside Card */
        .card-text {
            font-size: 38px;
            line-height: 1.8;
            color: #2c1a0e;
            font-weight: 500;
        }

        .underline-gap {
            display: inline-block;
            width: 200px;
            border-bottom: 3px solid #2c1a0e;
        }

        /* Header Tag (Blue Pill) */
        .header-tag {
            background: white;
            /* The image shows it's actually white text with blue outline or similar. Let's do Blue Text style */
            color: #4a90e2;
            font-weight: 900;
            font-size: 32px;
            font-family: sans-serif;
            text-shadow: 2px 2px 0px #fff;
        }

        /* Buttons */
        .btn-pill {
            border-radius: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 32px;
            font-weight: bold;
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.2);
            text-align: center;
            padding: 0 20px;
        }

        .btn-red {
            background: linear-gradient(90deg, #ff7e7e, #ff4d4d);
        }

        .btn-blue {
            background: linear-gradient(90deg, #5ec3ff, #4a90e2);
        }

        /* Lion Placeholder (Since no asset provided) */
        .lion-asset {
            background: transparent;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 300px;
            /* Huge Emoji as placeholder */
            filter: drop-shadow(10px 10px 20px rgba(0, 0, 0, 0.5));
            pointer-events: none;
            /* Usually allow click through, but wrapper is draggable */
        }

        /* Logo */
        .logo-area {
            color: white;
            font-family: sans-serif;
            font-weight: bold;
            font-size: 24px;
            display: flex;
            align-items: center;
            gap: 10px;
            text-shadow: 0 2px 5px rgba(0, 0, 0, 0.3);
        }
    </style>
</head>

<body>

    <div id="app">
        <div class="component decor-hill" style="top: 800px; left: -100px; width: 600px; height: 400px; z-index: 50;">
        </div>
        <div class="component decor-hill"
            style="top: 850px; left: 1400px; width: 600px; height: 400px; z-index: 50; background: #654321;"></div>

        <div class="component" style="top: 100px; left: 180px; width: 1400px; height: 850px; z-index: 100;">
            <div class="main-card" style="width: 100%; height: 100%;">
                <div contenteditable="true"
                    style="position: absolute; top: -30px; left: 40px; background: white; padding: 10px 30px; border-radius: 30px; color: #4a90e2; font-weight: bold; font-size: 32px; box-shadow: 0 5px 15px rgba(0,0,0,0.1);">
                    第四册 第12页
                </div>

                <div class="card-text" contenteditable="true" style="margin-top: 40px;">
                    <p style="text-indent: 2em; margin-bottom: 20px;">
                        赫拉克勒斯身手敏捷，闪电般地一躲，巨狮扑了个空。这下可激怒了这头凶猛的怪兽，它扭转身子，浑身毛发竖立，甩着大尾巴再一次向赫拉克勒斯袭来。赫拉克勒斯机智地借助狮体移动产生的旋风，两脚一蹬，升到了半空，然后他举起木棍，<span
                            class="underline-gap"></span>。木棍被打断，巨狮也被打得昏了头脑，四脚一软，瘫在了地上。
                    </p>
                </div>
            </div>
            <div class="resize-handle"></div>
            <div class="delete-btn">X</div>
        </div>

        <div class="component" style="top: 720px; left: 350px; width: 700px; height: 80px; z-index: 501;">
            <div class="btn-pill btn-red" style="width: 100%; height: 100%;" contenteditable="true">
                这头凶猛的怪兽被激怒后做了什么？
            </div>
            <div class="resize-handle"></div>
            <div class="delete-btn">X</div>
        </div>

        <div class="component" style="top: 830px; left: 450px; width: 500px; height: 80px; z-index: 502;">
            <div class="btn-pill btn-blue" style="width: 100%; height: 100%;" contenteditable="true">
                赫拉克勒斯会如何应对呢？
            </div>
            <div class="resize-handle"></div>
            <div class="delete-btn">X</div>
        </div>

        <div class="component" style="top: 650px; left: 1350px; width: 400px; height: 400px; z-index: 600;">
            <div class="lion-asset" style="width: 100%; height: 100%;">
                🦁
            </div>
            <div class="resize-handle"></div>
            <div class="delete-btn">X</div>
        </div>

        <div class="component" style="top: 40px; left: 1700px; width: 200px; height: 50px; z-index: 800;">
            <div class="logo-area" contenteditable="true" style="width: 100%; height: 100%;">
                🎓 学而思网校
            </div>
            <div class="resize-handle"></div>
            <div class="delete-btn">X</div>
        </div>

    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const app = document.getElementById('app');
            const historyStack = [];
            let historyIndex = -1;
            const MAX_HISTORY = 20;

            // --- History System ---
            function saveState() {
                // If we are in the middle of the stack, truncate future
                if (historyIndex < historyStack.length - 1) {
                    historyStack.length = historyIndex + 1;
                }
                historyStack.push(app.innerHTML);
                if (historyStack.length > MAX_HISTORY) historyStack.shift();
                else historyIndex++;
                console.log('State Saved. Index:', historyIndex);
            }

            // Initial Save
            saveState();

            function restoreState(index) {
                if (index >= 0 && index < historyStack.length) {
                    app.innerHTML = historyStack[index];
                    historyIndex = index;
                }
            }

            // Global Undo/Redo Keys
            document.addEventListener('keydown', (e) => {
                // Delete
                if (e.key === 'Delete' || e.key === 'Backspace') {
                    // Only delete if not editing text
                    const activeElement = document.activeElement;
                    const isEditing = activeElement.isContentEditable;

                    if (!isEditing) {
                        const selected = app.querySelector('.selected');
                        if (selected) {
                            selected.remove();
                            saveState();
                        }
                    }
                }

                // Undo: Ctrl+Z
                if ((e.ctrlKey || e.metaKey) && e.key === 'z' && !e.shiftKey) {
                    e.preventDefault();
                    if (historyIndex > 0) {
                        restoreState(historyIndex - 1);
                    }
                }
                // Redo: Ctrl+Y or Ctrl+Shift+Z
                if (((e.ctrlKey || e.metaKey) && e.key === 'y') ||
                    ((e.ctrlKey || e.metaKey) && e.shiftKey && e.key === 'z')) {
                    e.preventDefault();
                    if (historyIndex < historyStack.length - 1) {
                        restoreState(historyIndex + 1);
                    }
                }
            });

            // --- Interaction Logic (Delegation) ---
            let isDragging = false;
            let isResizing = false;
            let currentElement = null;
            let startX, startY;
            let initialLeft, initialTop;
            let initialWidth, initialHeight;
            let initialScale = 1;

            // Helper to get scale from transform matrix
            function getScale(element) {
                const style = window.getComputedStyle(element);
                const matrix = new WebKitCSSMatrix(style.transform);
                return matrix.a; // Scale X
            }

            // Helper to set scale
            function setScale(element, scale) {
                element.style.transform = `scale(${scale})`;
            }

            // Event Delegation on App
            app.addEventListener('mousedown', (e) => {
                // 1. Check for Delete Button
                if (e.target.classList.contains('delete-btn')) {
                    const comp = e.target.closest('.component');
                    if (comp) {
                        comp.remove();
                        saveState();
                    }
                    return;
                }

                // 2. Check for Resize Handle
                if (e.target.classList.contains('resize-handle')) {
                    isResizing = true;
                    currentElement = e.target.closest('.component');

                    startX = e.clientX;
                    startY = e.clientY;

                    const rect = currentElement.getBoundingClientRect();
                    initialWidth = rect.width; // Visual width
                    initialScale = getScale(currentElement);

                    e.preventDefault();
                    e.stopPropagation();
                    return;
                }

                // 3. Check for Draggable Component
                const component = e.target.closest('.component');

                // Deselect others
                if (!e.shiftKey) {
                    document.querySelectorAll('.component.selected').forEach(el => {
                        if (el !== component) el.classList.remove('selected');
                    });
                }

                if (component) {
                    // Logic: If clicking ContentEditable, allow focus. If clicking container padding, drag.
                    // If element is already selected and we click text, edit.
                    // If element is NOT selected, we select it.

                    component.classList.add('selected');
                    currentElement = component;

                    // If clicking directly on a text node or contenteditable, don't drag immediately unless it's a "move" intent
                    // Simple heuristic: If target is explicitly contenteditable, ignore drag.
                    if (e.target.isContentEditable) {
                        // Allow text selection/editing
                        return;
                    }

                    isDragging = true;
                    startX = e.clientX;
                    startY = e.clientY;
                    initialLeft = component.offsetLeft;
                    initialTop = component.offsetTop;

                    e.preventDefault(); // Prevent text selection on container
                } else {
                    // Clicked background, deselect all
                    document.querySelectorAll('.component.selected').forEach(el => el.classList.remove('selected'));
                }
            });

            window.addEventListener('mousemove', (e) => {
                if (isDragging && currentElement) {
                    const dx = e.clientX - startX;
                    const dy = e.clientY - startY;

                    // Apply new position
                    currentElement.style.left = `${initialLeft + dx}px`;
                    currentElement.style.top = `${initialTop + dy}px`;
                }

                if (isResizing && currentElement) {
                    const dx = e.clientX - startX;
                    // Simple uniform scaling based on horizontal drag
                    // Sensitivity: 1px drag = 0.005 scale change
                    const scaleDelta = dx * 0.002;
                    let newScale = initialScale + scaleDelta;

                    // Min scale limit
                    if (newScale < 0.2) newScale = 0.2;

                    setScale(currentElement, newScale);
                }
            });

            window.addEventListener('mouseup', (e) => {
                if (isDragging || isResizing) {
                    saveState(); // Record history on drop/resize end
                }
                isDragging = false;
                isResizing = false;
                currentElement = null;
            });

            // Save state on text edit blur
            app.addEventListener('focusout', (e) => {
                if (e.target.isContentEditable) {
                    saveState();
                }
            });

        });
    </script>
</body>

</html>
