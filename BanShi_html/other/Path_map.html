<!DOCTYPE html>

<head>
    <meta charset="UTF-8">
    <title>Story Map Interactive - Refined</title>
    <style>
        /* =========================================
           RESET & GLOBAL
           ========================================= */
        * {
            box-sizing: border-box;
            user-select: none;
        }

        body,
        html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #2c3e50;
            font-family: "Microsoft YaHei", "Heiti SC", sans-serif;
        }

        /* =========================================
           CANVAS (#app) 1920x1080
           ========================================= */
        #app {
            position: relative;
            width: 1920px;
            height: 1080px;
            background: #5b9bd5;
            /* Outer Blue Background */
            overflow: hidden;
            margin: 0 auto;
            transform-origin: top left;
            box-shadow: 0 0 100px rgba(0, 0, 0, 0.5);
        }

        /* =========================================
           COMPONENTS
           ========================================= */
        .comp-wrapper {
            position: absolute;
            transition: box-shadow 0.2s, transform 0.1s;
        }

        /* Hover & Selection States */
        .comp-wrapper:hover {
            outline: 2px dashed rgba(255, 255, 255, 0.4);
            cursor: move;
        }

        .comp-wrapper.selected {
            outline: 3px solid #ff0055;
            z-index: 9999 !important;
        }

        /* --- 1. Scroll/Parchment Style --- */
        .paper-body {
            background-color: #fffbf0;
            border-radius: 4px;
            box-shadow: inset 0 0 80px rgba(210, 180, 140, 0.2);
        }

        .scroll-roller {
            /* Golden/Orange Gradient to simulate cylinder */
            background: linear-gradient(90deg, #e67e22 0%, #f1c40f 40%, #fffacd 50%, #f1c40f 60%, #d35400 100%);
            border-radius: 30px;
            box-shadow: 5px 0 15px rgba(0, 0, 0, 0.4);
            border: 2px solid #c0392b;
        }

        .roller-cap {
            position: absolute;
            width: 100%;
            height: 40px;
            background: #d35400;
            border-radius: 50%;
            border: 2px solid #a04000;
        }

        /* --- 2. Path Line --- */
        .path-line {
            filter: drop-shadow(0 4px 2px rgba(0, 0, 0, 0.1));
        }

        /* --- 3. Character Circle --- */
        .char-circle {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            border: 6px solid #a9ddef;
            /* Light Blue Border */
            background-color: #eee;
            background-size: cover;
            background-position: center;
            box-shadow: 0 6px 12px rgba(0, 0, 0, 0.15);
            overflow: hidden;
        }

        /* --- 4. Number Badge --- */
        .num-badge {
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #5c97ff 0%, #3567d6 100%);
            color: white;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 36px;
            font-weight: 900;
            border: 4px solid #fff;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
        }

        /* --- 5. Text Bubble --- */
        .text-bubble {
            width: 100%;
            height: 100%;
            background-color: #8bebf9;
            /* Cyan Blue */
            color: #2c3e50;
            border-radius: 20px;
            /* Pill shape */
            padding: 15px;
            font-size: 32px;
            font-weight: bold;
            line-height: 1.2;
            text-align: center;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 5px 0 #5fbcc9;
            /* 3D bottom edge */
        }

        .text-bubble[contenteditable]:focus {
            background-color: #fff;
            outline: none;
        }

        /* --- UI Controls --- */
        .resize-handle {
            position: absolute;
            bottom: -10px;
            right: -10px;
            width: 20px;
            height: 20px;
            background: white;
            border: 2px solid #333;
            border-radius: 50%;
            cursor: se-resize;
            display: none;
            z-index: 10000;
        }

        .delete-btn {
            position: absolute;
            top: -15px;
            right: -15px;
            width: 30px;
            height: 30px;
            background: #ff4757;
            color: white;
            border-radius: 50%;
            text-align: center;
            line-height: 28px;
            font-weight: bold;
            cursor: pointer;
            display: none;
            z-index: 10000;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.2);
        }

        .comp-wrapper.selected .resize-handle,
        .comp-wrapper.selected .delete-btn {
            display: block;
        }

        /* Helper: Start/End Decors */
        .decor-star {
            font-size: 60px;
            color: #f1c40f;
            text-shadow: 0 2px 5px rgba(0, 0, 0, 0.2);
            position: absolute;
        }
    </style>
</head>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const app = document.getElementById('app');
            const historyStack = [];
            let historyIndex = -1;

            let selectedEl = null;
            let isDragging = false;
            let isResizing = false;
            let startX, startY;
            let initialLeft, initialTop, initialWidth, initialHeight, initialTransform;

            // --- History ---
            function saveState() {
                if (historyIndex < historyStack.length - 1) historyStack.splice(historyIndex + 1);
                historyStack.push(app.innerHTML);
                if (historyStack.length > 20) historyStack.shift(); else historyIndex++;
            }
            saveState(); // Initial

            function undo() {
                if (historyIndex > 0) {
                    historyIndex--;
                    app.innerHTML = historyStack[historyIndex];
                    selectedEl = null; // Clear selection after undo
                }
            }

            // --- Selection ---
            function select(el) {
                if (selectedEl) selectedEl.classList.remove('selected');
                selectedEl = el;
                if (selectedEl) selectedEl.classList.add('selected');
            }

            // --- Interaction ---
            app.addEventListener('mousedown', (e) => {
                // 1. Resize Handle
                if (e.target.classList.contains('resize-handle')) {
                    isResizing = true;
                    const wrapper = e.target.closest('.comp-wrapper');
                    select(wrapper);
                    startX = e.clientX;
                    const style = window.getComputedStyle(wrapper);
                    // Simple Width-based scale logic for demonstration
                    initialWidth = parseFloat(style.width);
                    initialTransform = style.transform === 'none' ? '' : style.transform;
                    e.preventDefault();
                    return;
                }

                // 2. Delete
                if (e.target.classList.contains('delete-btn')) {
                    const wrapper = e.target.closest('.comp-wrapper');
                    wrapper.remove();
                    selectedEl = null;
                    saveState();
                    return;
                }

                // 3. Drag
                const wrapper = e.target.closest('.comp-wrapper');
                if (wrapper) {
                    if (e.target.getAttribute('contenteditable') === 'true') {
                        select(wrapper); return; // Edit mode
                    }
                    isDragging = true;
                    select(wrapper);
                    startX = e.clientX;
                    startY = e.clientY;
                    initialLeft = wrapper.offsetLeft;
                    initialTop = wrapper.offsetTop;
                    e.preventDefault();
                } else {
                    if (selectedEl) selectedEl.classList.remove('selected');
                    selectedEl = null;
                }
            });

            window.addEventListener('mousemove', (e) => {
                if (isDragging && selectedEl) {
                    const dx = e.clientX - startX;
                    const dy = e.clientY - startY;
                    selectedEl.style.left = initialLeft + dx + 'px';
                    selectedEl.style.top = initialTop + dy + 'px';
                }
                if (isResizing && selectedEl) {
                    // Scale Logic: Simplification using Transform Scale
                    const dx = e.clientX - startX;
                    const scaleFactor = 1 + (dx / 200);
                    // Note: Real implementation would parse matrix, here we just reset scale
                    selectedEl.style.transform = `scale(${Math.max(0.5, scaleFactor)})`;
                }
            });

            window.addEventListener('mouseup', () => {
                if (isDragging || isResizing) saveState();
                isDragging = false; isResizing = false;
            });

            app.addEventListener('focusout', (e) => {
                if (e.target.getAttribute('contenteditable') === 'true') saveState();
            });

            document.addEventListener('keydown', (e) => {
                if ((e.key === 'Delete' || e.key === 'Backspace') && selectedEl) {
                    if (document.activeElement.getAttribute('contenteditable') === 'true') return;
                    selectedEl.remove(); selectedEl = null; saveState();
                }
                if ((e.ctrlKey || e.metaKey) && e.key === 'z') {
                    e.preventDefault(); undo();
                }
            });
        });
    </script>
