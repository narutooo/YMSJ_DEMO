<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Courseware Layout Generator</title>
    <style>
        /* ---------------------------------------------------
           全局重置与基础样式
           --------------------------------------------------- */
        * {
            box-sizing: border-box;
            user-select: none;
            /* 防止文本选择干扰拖拽，文本编辑时会自动覆盖 */
        }

        body,
        html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #333;
            /* 画布外的深色背景 */
            font-family: "Microsoft YaHei", sans-serif;
        }

        /* ---------------------------------------------------
           #app 画布 (1920x1080)
           --------------------------------------------------- */
        #app {
            position: absolute;
            width: 1920px;
            height: 1080px;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0.8);
            /* 预览缩放，适应屏幕 */
            background: linear-gradient(135deg, #7F7FD5 0%, #86A8E7 50%, #91EAE4 100%);
            /* 模拟星空背景 */
            overflow: hidden;
            box-shadow: 0 0 50px rgba(0, 0, 0, 0.5);
            transform-origin: center center;
        }

        /* ---------------------------------------------------
           组件通用样式 (Draggable, Resizable, Selected)
           --------------------------------------------------- */
        .component {
            position: absolute;
            transform-origin: top left;
            /* 默认缩放为1，后续JS控制 */
            transform: scale(1);
            cursor: grab;
        }

        .component:active {
            cursor: grabbing;
        }

        /* 选中状态：显示虚线框和删除按钮 */
        .component.selected {
            outline: 2px dashed #0099ff;
            z-index: 9999 !important;
            /* 选中时临时置顶，便于操作 */
        }

        /* 右下角缩放手柄 (24px 白色圆形) */
        .resize-handle {
            position: absolute;
            width: 24px;
            height: 24px;
            background-color: white;
            border: 1px solid #ccc;
            border-radius: 50%;
            bottom: -12px;
            right: -12px;
            cursor: se-resize;
            display: none;
            /* 默认隐藏 */
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.2);
            z-index: 10001;
        }

        .component.selected .resize-handle {
            display: block;
        }

        /* 删除按钮 (右上角) */
        .delete-btn {
            position: absolute;
            width: 24px;
            height: 24px;
            background-color: #ff4d4f;
            color: white;
            border-radius: 50%;
            text-align: center;
            line-height: 22px;
            font-size: 16px;
            font-weight: bold;
            top: -12px;
            right: -12px;
            cursor: pointer;
            display: none;
            z-index: 10001;
        }

        .component.selected .delete-btn {
            display: block;
        }

        /* 文本可编辑区域 */
        [contenteditable="true"] {
            cursor: text;
            outline: none;
            user-select: text;
        }

        /* ---------------------------------------------------
           特定组件样式 (模拟素材)
           --------------------------------------------------- */

        /* 1. 羊皮卷轴主容器 */
        .scroll-container {
            background-color: #FFFDF0;
            border-radius: 20px;
            box-shadow: inset 0 0 50px rgba(139, 69, 19, 0.1);
        }

        /* 卷轴左右的轴 */
        .scroll-roll {
            position: absolute;
            width: 60px;
            height: 100%;
            background: linear-gradient(to right, #FFD700, #FFA500, #FFD700);
            border-radius: 10px;
            box-shadow: 5px 0 15px rgba(0, 0, 0, 0.3);
        }

        /* 2. 路径线 (SVG) */
        .path-svg {
            pointer-events: none;
            /* 让鼠标穿透，不影响下方点击 */
            filter: drop-shadow(0 4px 4px rgba(0, 0, 0, 0.1));
        }

        /* 3. 节点圆形图片框 */
        .node-image {
            border-radius: 50%;
            border: 6px solid #6BA8FF;
            background-color: #eee;
            background-size: cover;
            background-position: center;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
            overflow: hidden;
        }

        /* 节点序号 */
        .node-number {
            position: absolute;
            width: 40px;
            height: 40px;
            background: linear-gradient(180deg, #7F7FD5, #86A8E7);
            color: white;
            border-radius: 50%;
            text-align: center;
            line-height: 40px;
            font-weight: bold;
            font-size: 24px;
            border: 3px solid white;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.2);
            top: 10px;
            left: -10px;
            z-index: 2;
        }

        /* 4. 文本气泡 */
        .text-bubble {
            background-color: #A3DFF8;
            /* 浅蓝底 */
            color: #2c3e50;
            padding: 15px 20px;
            border-radius: 15px;
            font-weight: bold;
            font-size: 24px;
            text-align: center;
            box-shadow: 0 4px 0 rgba(0, 0, 0, 0.1);
            display: flex;
            align-items: center;
            justify-content: center;
            line-height: 1.2;
        }

        /* 右上角星星装饰 */
        .star-decor {
            color: #FFD700;
            font-size: 60px;
            filter: drop-shadow(0 0 5px orange);
        }
    </style>
</head>

    <script>
        // ----------------------------------------------------------------------
        // 核心逻辑: 拖拽、缩放、删除、历史记录
        // ----------------------------------------------------------------------

        const app = document.getElementById('app');
        const historyStack = [];
        let isDragging = false;
        let isResizing = false;
        let currentElement = null;
        let startX, startY, startLeft, startTop, startScale;

        // 初始化历史记录
        function saveState() {
            // 限制历史记录长度
            if (historyStack.length > 20) historyStack.shift();
            historyStack.push(app.innerHTML);
        }
        // 保存初始状态
        saveState();

        // -----------------------
        // 事件委托：鼠标按下
        // -----------------------
        document.addEventListener('mousedown', (e) => {
            // 1. 处理删除按钮点击
            if (e.target.classList.contains('delete-btn')) {
                const component = e.target.closest('.component');
                if (component) {
                    component.remove();
                    saveState();
                }
                return;
            }

            // 2. 处理缩放手柄点击
            if (e.target.classList.contains('resize-handle')) {
                isResizing = true;
                currentElement = e.target.closest('.component');
                startX = e.clientX;
                startY = e.clientY;
                // 获取当前的 scale 值
                const style = window.getComputedStyle(currentElement);
                const matrix = new WebKitCSSMatrix(style.transform);
                startScale = matrix.a; // scaleX
                e.preventDefault();
                return;
            }

            // 3. 处理组件选中与拖拽
            const component = e.target.closest('.component');

            // 清除之前的选中状态（除非按住了Shift，此处简化为单选）
            if (!component || !component.classList.contains('selected')) {
                document.querySelectorAll('.component.selected').forEach(el => el.classList.remove('selected'));
            }

            if (component) {
                // 如果点击的是可编辑文本，不触发拖拽
                if (e.target.isContentEditable) return;

                // 选中当前组件
                component.classList.add('selected');

                isDragging = true;
                currentElement = component;
                startX = e.clientX;
                startY = e.clientY;
                startLeft = parseInt(component.style.left || 0);
                startTop = parseInt(component.style.top || 0);
            } else {
                // 点击空白处，取消所有选中
                document.querySelectorAll('.component.selected').forEach(el => el.classList.remove('selected'));
            }
        });

        // -----------------------
        // 事件监听：鼠标移动
        // -----------------------
        document.addEventListener('mousemove', (e) => {
            if (isDragging && currentElement) {
                const dx = e.clientX - startX;
                const dy = e.clientY - startY;
                // 考虑 #app 可能有的缩放 (scale=0.8)，拖拽距离需反向补偿，这里简化处理，假设画布scale是视觉调整
                // 实际绝对定位计算:
                currentElement.style.left = `${startLeft + dx}px`;
                currentElement.style.top = `${startTop + dy}px`;
            } else if (isResizing && currentElement) {
                const dx = e.clientX - startX;
                // 简单的缩放逻辑：向右拖动放大，向左缩小
                // 灵敏度控制 / 100
                const newScale = Math.max(0.2, startScale + dx / 200);
                currentElement.style.transform = `scale(${newScale})`;
            }
        });

        // -----------------------
        // 事件监听：鼠标抬起
        // -----------------------
        document.addEventListener('mouseup', () => {
            if (isDragging || isResizing) {
                isDragging = false;
                isResizing = false;
                currentElement = null;
                saveState(); // 操作结束，保存快照
            }
        });

        // -----------------------
        // 键盘事件：删除与撤销
        // -----------------------
        document.addEventListener('keydown', (e) => {
            // 删除 (Delete / Backspace)
            if (e.key === 'Delete' || e.key === 'Backspace') {
                // 如果正在编辑文字，不删除组件
                if (document.activeElement.isContentEditable) return;

                const selected = document.querySelectorAll('.component.selected');
                if (selected.length > 0) {
                    selected.forEach(el => el.remove());
                    saveState();
                }
            }

            // 撤销 (Ctrl + Z)
            if ((e.ctrlKey || e.metaKey) && e.key === 'z') {
                e.preventDefault();
                if (historyStack.length > 1) {
                    historyStack.pop(); // 移除当前状态
                    const prevState = historyStack[historyStack.length - 1];
                    app.innerHTML = prevState;
                }
            }
        });

        // -----------------------
        // 文本编辑监听 (blur时保存状态)
        // -----------------------
        document.addEventListener('focusout', (e) => {
            if (e.target.isContentEditable) {
                saveState();
            }
        }, true);

    </script>
